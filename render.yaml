services:
  - type: web
    name: trevasq-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USERNAME
        value: neeltapake21@gmail.com
      - key: SMTP_PASSWORD
        value: arlgpzbqkygzzgnj
      - key: EMAIL_FROM_ADDRESS
        value: neeltapake21@gmail.com
      - key: EMAIL_FROM_NAME
        value: TrevasQ Marketing
