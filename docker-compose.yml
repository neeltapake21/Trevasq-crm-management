version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trevasq_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://trevasq_admin:trevasq_secure_pass@db:5432/trevasq_db
      - REDIS_URL=redis://redis:6379/0
      - APP_NAME=TrevasQ Automated Marketing Platform
      - APP_ENV=production
      - EMAIL_PROVIDER=test
      - EMAIL_TEST_MODE=true
      - FRONTEND_URL=http://localhost
      - BACKEND_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trevasq_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: trevasq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trevasq_admin
      POSTGRES_PASSWORD: trevasq_secure_pass
      POSTGRES_DB: trevasq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trevasq_admin -d trevasq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trevasq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
